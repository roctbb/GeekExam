name: geekclass-guard
x-guard: &guard
  build:
    context: .
    args:
      VCS_REF: ${GUARD_REVISION:-unknown}
  image: ${GUARD_IMAGE:-geekclass-guard:local}
  env_file: .env
  environment:
    GUARD_DATABASE_URL: postgresql+psycopg2://guard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/guard
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: guard
      POSTGRES_DB: guard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - guard-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U guard -d guard"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  init:
    <<: *guard
    command: [flask, --app, guard_service:create_app, init-db]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
  guard:
    <<: *guard
    ports:
      - 127.0.0.1:8088:8088
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  guard-db:
