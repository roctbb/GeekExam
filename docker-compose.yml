services:
  backend:
    build: ./backend
    expose:
      - "8085"
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      EXECUTOR_STORAGE_DIR: /app/executor-data
    volumes:
      - executor_data:/app/executor-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8085/api/me')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  celery_worker:
    build: ./backend
    command: celery -A celery_app worker --loglevel=info -Q auditor_queue
    depends_on:
      backend:
        condition: service_healthy
    env_file: .env
    environment:
      EXECUTOR_STORAGE_DIR: /app/executor-data
    volumes:
      - executor_data:/app/executor-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; from celery_app import celery; replies = celery.control.inspect(destination=['celery@' + socket.gethostname()], timeout=2).ping(); raise SystemExit(0 if replies else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  presence_worker:
    build: ./backend
    command: celery -A celery_app worker --loglevel=info -Q presence_queue --concurrency=1 --hostname=presence@%h
    depends_on:
      backend:
        condition: service_healthy
    env_file: .env
    restart: unless-stopped

  celery_beat:
    build: ./backend
    command: celery -A celery_app beat --loglevel=info
    depends_on:
      backend:
        condition: service_healthy
    env_file: .env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:6767:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: geekexam
      POSTGRES_USER: geekexam
      POSTGRES_PASSWORD: geekexam
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
  executor_data:
